[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orguine"
version = "2.1.1"
description = "Orguine — organize suas pastas com prévia, backup e desfazer (PySide6)."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "CleitinhoDEV" }]
keywords = ["organizer", "files", "folders", "pyside6", "downloads", "organizador"]
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6,<7",
    "Send2Trash>=1.8",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Environment :: X11 Applications :: Qt",
    "Topic :: System :: Filesystems",
]

[project.optional-dependencies]
exif = ["Pillow>=10"]
dev = ["pytest>=8", "pytest-qt>=4.4", "Pillow>=10", "pyinstaller>=6.3"]

[project.urls]
Homepage = "https://github.com/cleitinhodev/orguine"
Repository = "https://github.com/cleitinhodev/orguine"
Website = "https://www.bugzinho.com/"
Donate = "https://www.bugzinho.com/donate"

[project.scripts]
orguine-cli = "orguine.cli:main"

[project.gui-scripts]
orguine = "orguine.__main__:main"

[tool.setuptools.packages.find]
include = ["orguine*"]

[tool.setuptools.package-data]
orguine = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
